name: Build idkbot (Android64)

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: idkbot-android64
          path: ${{ steps.build.outputs.build-output }}
